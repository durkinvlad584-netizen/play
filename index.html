<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Игры">
<title>Игры без памяти</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  body {
    min-height:100vh;
    background-color:#1a1a3a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#fff;
    display:flex; flex-direction:column; align-items:center;
    padding: env(safe-area-inset-top, 20px) 20px 40px;
  }
  
  .container {
    width: 100%;
    max-width: 420px;
  }

  h1 {
    font-size: 32px;
    font-weight: 900;
    line-height: 1.2;
    margin-top: 30px;
    margin-bottom: 25px;
    text-align: left;
    background: linear-gradient(135deg, #fff, #b0b0ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }

  .games-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .game-card {
    display: flex;
    align-items: center;
    background: linear-gradient(180deg, #34346b 0%, #25254e 100%);
    border: 2px solid #4a4a8a;
    border-radius: 18px;
    padding: 20px;
    text-decoration: none;
    color: #fff;
    position: relative;
    /* "толстое" нижнее ребро + мягкая тень + блик сверху */
    box-shadow:
      0 7px 0 #12122e,
      0 14px 22px rgba(0,0,0,0.45),
      inset 0 2px 0 rgba(255,255,255,0.22),
      inset 0 -3px 0 rgba(0,0,0,0.25);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .game-card:active {
    transform: translateY(5px);
    box-shadow:
      0 2px 0 #12122e,
      0 4px 8px rgba(0,0,0,0.4),
      inset 0 2px 0 rgba(255,255,255,0.15),
      inset 0 -2px 0 rgba(0,0,0,0.25);
  }

  .game-icon {
    width: 54px;
    height: 54px;
    border-radius: 14px;
    background: linear-gradient(145deg, #7a7aff, #5b5bf0 45%, #8a2be2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-right: 16px;
    box-shadow:
      0 4px 0 #3a1f8f,
      0 8px 12px rgba(90, 90, 240, 0.4),
      inset 0 2px 0 rgba(255,255,255,0.45),
      inset 0 -3px 0 rgba(0,0,0,0.2);
    flex-shrink: 0;
    margin-bottom: 4px;
  }

  .game-info {
    display: flex;
    flex-direction: column;
  }

  .game-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .game-desc {
    font-size: 13px;
    opacity: 0.6;
  }

  /* Заглушка для будущих игр */
  .game-card.disabled {
    opacity: 0.5;
    pointer-events: none;
  }

  .games-list { padding-bottom: 8px; }
</style>
</head>
<body>

<div class="container">
  <h1>Игры без памяти</h1>

  <div class="games-list">
    
    <!-- Карточка игры 1: Block Blast -->
    <a href="blockblast.html" class="game-card">
      <div class="game-icon">🧩</div>
      <div class="game-info">
        <div class="game-title">Block Blast</div>
        <div class="game-desc">Складывай блоки, собирай линии</div>
      </div>
    </a>

    <!-- Карточка игры 2: Water Sort -->
    <a href="watersort.html" class="game-card">
      <div class="game-icon">🧪</div>
      <div class="game-info">
        <div class="game-title">Water Sort</div>
        <div class="game-desc">Переливай жидкости по колбам</div>
      </div>
    </a>

    <!-- Карточка-заглушка (пример для будущей игры) -->
    <div class="game-card disabled">
      <div class="game-icon">🎮</div>
      <div class="game-info">
        <div class="game-title">Скоро...</div>
        <div class="game-desc">Новая игра появится здесь</div>
      </div>
    </div>

  </div>
</div>

<script>if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>
</body>
</html>
