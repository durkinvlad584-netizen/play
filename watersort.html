<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Игры">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Water Sort Puzzle</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  body {
    height:100vh; height:100dvh; overflow:hidden;
    background-color:#1e1e2f;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#fff; touch-action:none;
    display:flex; flex-direction:column; align-items:center;
    position: relative;
  }

  header {
    width:100%; max-width:420px;
    display:flex; justify-content:space-between; align-items:center;
    padding: calc(max(env(safe-area-inset-top, 0px), 12px) + 16px) 20px 10px;
    z-index: 10;
  }
  .icon-btn {
    width: 44px; height: 44px;
    background-color: #33334d;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.2s;
    text-decoration: none; /* Для ссылки */
  }
  .icon-btn:active { transform: scale(0.9); }
  .icon-btn svg { width: 24px; height: 24px; fill: #fff; opacity: 0.8; }
  
  .level-info { text-align: center; }
  .difficulty { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: #ffb400; font-weight: 700; margin-bottom: 2px; }
  .level-title { font-size: 24px; font-weight: 800; }

  #game-board {
    flex: 1;
    width: 100%; max-width: 420px;
    display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
    gap: 15px 20px;
    padding: 10px 20px 40px;
    position: relative;
  }

  .tube {
    width: 50px;
    height: 180px;
    position: relative;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    transform-origin: bottom center;
    z-index: 1;
  }
  .tube.selected {
    transform: translateY(-20px);
    z-index: 5;
  }
  
  .tube-bg.complete-flash {
    animation: flash 0.6s ease-out;
  }
  @keyframes flash {
    0% { 
      filter: brightness(2); 
      box-shadow: inset 0 0 20px #fff, 0 0 30px #fff; 
    }
    100% { 
      filter: brightness(1); 
      box-shadow: none; 
    }
  }

  .tube-bg {
    position: absolute;
    inset: 0;
    border: 3px solid #55556d;
    border-top: none;
    border-radius: 0 0 25px 25px;
    overflow: hidden;
    background-color: #2a2a40;
    display: flex;
    flex-direction: column-reverse;
    transition: box-shadow 0.3s, filter 0.3s;
    box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.05);
  }

  .tube-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 0 0 25px 25px;
    background: linear-gradient(
      to right,
      rgba(255, 255, 255, 0.25) 0%,
      rgba(255, 255, 255, 0.05) 15%,
      transparent 15%,
      transparent 85%,
      rgba(255, 255, 255, 0.1) 85%,
      rgba(255, 255, 255, 0.05) 100%
    );
    pointer-events: none;
    z-index: 3;
  }

  .tube-rim {
    position: absolute;
    top: -4px; left: -3px; right: -3px;
    height: 6px;
    background: #55556d;
    border-radius: 3px;
    z-index: 4;
  }

  .liquid {
    width: 100%;
    height: 25%;
    transition: height 0.3s ease-out, background-color 0.3s;
    flex-shrink: 0;
    position: relative;
  }

  .flying-tube {
    position: fixed;
    width: 50px;
    height: 180px;
    z-index: 100;
    pointer-events: none;
    transform-origin: top center; 
  }

  .stream {
    position: fixed;
    width: 10px;
    background: #fff;
    border-radius: 5px;
    z-index: 50;
    pointer-events: none;
    transition: opacity 0.2s;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
  }

  #confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 200;
    overflow: hidden;
  }

  .confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    pointer-events: none;
    border-radius: 2px;
  }

  @keyframes shake {
    0% { transform: translate(0, 0) rotate(0deg); }
    20% { transform: translate(-3px, 2px) rotate(-0.5deg); }
    40% { transform: translate(3px, -2px) rotate(0.5deg); }
    60% { transform: translate(-2px, -3px) rotate(-0.3deg); }
    80% { transform: translate(2px, 3px) rotate(0.3deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  .shake-effect {
    animation: shake 0.2s ease-in-out;
  }

  footer {
    width: 100%; max-width: 420px;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 30px calc(max(env(safe-area-inset-bottom, 0px), 12px) + 24px);
    z-index: 10;
  }
  .tool-btn { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .tool-btn:active { transform: scale(0.9); }
  .tool-icon {
    width: 60px; height: 60px;
    background-color: #33334d;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    position: relative;
  }
  .tool-icon svg { width: 30px; height: 30px; fill: #fff; }
  .tool-label { font-size: 12px; font-weight: 600; opacity: 0.8; }
  
  .hint-badge {
    position: absolute;
    top: 0; right: 0;
    background: #ff5a5f; color: #fff;
    width: 20px; height: 20px; border-radius: 50%;
    font-size: 12px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #1e1e2f;
  }

  #win-screen {
    position: fixed; inset: 0;
    background: rgba(10,10,25,0.9);
    backdrop-filter: blur(8px);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1000;
    opacity: 0; transition: opacity 0.4s ease;
  }
  #win-screen.show { display: flex; opacity: 1; }
  #win-screen h2 { font-size: 36px; margin-bottom: 10px; color: #ffd166; text-shadow: 0 0 20px rgba(255,209,102,0.5); }
  #win-screen p { font-size: 16px; opacity: 0.8; margin-bottom: 30px; }
  
  .win-buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    max-width: 280px;
  }

  #next-level-btn, #home-btn {
    padding: 16px 0; font-size: 20px; font-weight: 800;
    border: none; border-radius: 16px;
    color: #fff; cursor: pointer;
    box-shadow: 0 10px 30px rgba(90,90,240,0.5);
    letter-spacing: 1px;
    text-align: center;
    text-decoration: none;
    display: block;
  }
  #next-level-btn {
    background: linear-gradient(135deg, #5b5bf0, #8a2be2);
  }
  #home-btn {
    background-color: #33334d;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    border: 2px solid #55556d;
  }
  #next-level-btn:active, #home-btn:active { transform: scale(0.95); }
</style>
</head>
<body>

<div id="confetti-layer"></div>

<header>
  <!-- Левая кнопка: На главную -->
  <a href="index.html" class="icon-btn">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
  </a>
  
  <div class="level-info">
    <div class="difficulty" id="diff-label">Легко</div>
    <div class="level-title" id="level-label">Уровень 1</div>
  </div>

  <!-- Правая кнопка: Рестарт -->
  <div class="icon-btn" onclick="restartLevel()">
    <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
  </div>
</header>

<div id="game-board"></div>

<footer>
  <div class="tool-btn" onclick="undo()">
    <div class="tool-icon">
      <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
    </div>
    <span class="tool-label">Отменить</span>
  </div>

  <div class="tool-btn" onclick="addTube()">
    <div class="tool-icon" style="background:#ffb400;">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      <div class="hint-badge" id="hint-count">3</div>
    </div>
    <span class="tool-label">Колба</span>
  </div>
</footer>

<div id="win-screen">
  <h2>Уровень пройден!</h2>
  <p>Отличная работа!</p>
  <div class="win-buttons">
    <button id="next-level-btn" onclick="nextLevel()">Следующий уровень</button>
    <a href="index.html" id="home-btn">Выбрать игру</a>
  </div>
</div>

<script>
  const COLORS = ['#ff5a5f', '#ffb400', '#00c2a8', '#4d8dff', '#b45bff', '#ff6ec7', '#8bc34a', '#ff9800', '#9c27b0', '#00bcd4', '#e91e63', '#795548'];
  const MAX_LAYERS = 4;
  
  let currentLevel = 1;
  let tubes = [];
  let history = [];
  let currentColors = 3;
  let emptyTubes = 2;
  let selectedTubeIndex = null;
  let isAnimating = false;
  let hintCount = 3;

  const boardEl = document.getElementById('game-board');
  const confettiLayer = document.getElementById('confetti-layer');

  function loadLevel() {
    try {
      const n = parseInt(localStorage.getItem('ws_level'), 10);
      return n >= 1 ? n : 1;
    } catch (e) { return 1; }
  }

  function saveLevel(level) {
    try { localStorage.setItem('ws_level', level); } catch (e) {}
  }

  function initLevel(level) {
    currentLevel = level;
    saveLevel(level);
    history = [];
    selectedTubeIndex = null;
    isAnimating = false;
    hintCount = 3;
    document.getElementById('hint-count').textContent = hintCount;
    document.getElementById('level-label').textContent = `Уровень ${level}`;
    
    if (level <= 2) { currentColors = 3; emptyTubes = 2; document.getElementById('diff-label').textContent = 'Легко'; }
    else if (level <= 5) { currentColors = 4; emptyTubes = 2; document.getElementById('diff-label').textContent = 'Средне'; }
    else if (level <= 8) { currentColors = 5; emptyTubes = 2; document.getElementById('diff-label').textContent = 'Сложно'; }
    else { 
      currentColors = Math.min(12, 5 + Math.floor((level - 8) / 2)); 
      emptyTubes = 2; 
      document.getElementById('diff-label').textContent = 'Очень сложно'; 
    }

    const totalTubes = currentColors + emptyTubes;
    let pool = [];
    for (let i = 0; i < currentColors; i++) {
      for (let j = 0; j < MAX_LAYERS; j++) pool.push(COLORS[i]);
    }
    pool.sort(() => Math.random() - 0.5);
    
    tubes = [];
    for (let i = 0; i < totalTubes; i++) tubes.push({ liquids: [], selected: false });
    
    for (let i = 0; i < currentColors; i++) {
      for (let j = 0; j < MAX_LAYERS; j++) tubes[i].liquids.push(pool.pop());
    }

    renderBoard();
  }

  function renderBoard() {
    boardEl.innerHTML = '';
    tubes.forEach((tube, index) => {
      const tubeEl = document.createElement('div');
      tubeEl.className = 'tube' + (tube.selected ? ' selected' : '');
      tubeEl.id = 'tube-' + index;
      tubeEl.onclick = () => handleTubeClick(index);

      const rim = document.createElement('div');
      rim.className = 'tube-rim';
      tubeEl.appendChild(rim);

      const bgEl = document.createElement('div');
      bgEl.className = 'tube-bg';
      bgEl.id = 'bg-' + index;

      tube.liquids.forEach(color => {
        const liq = document.createElement('div');
        liq.className = 'liquid';
        liq.style.backgroundColor = color;
        bgEl.appendChild(liq);
      });

      tubeEl.appendChild(bgEl);
      boardEl.appendChild(tubeEl);
    });
  }

  function handleTubeClick(index) {
    if (isAnimating) return;

    if (selectedTubeIndex !== null) {
      if (selectedTubeIndex === index) {
        selectedTubeIndex = null;
        tubes.forEach(t => t.selected = false);
        renderBoard();
        return;
      }
      animatePour(selectedTubeIndex, index);
    } else {
      if (tubes[index].liquids.length > 0) {
        selectedTubeIndex = index;
        tubes.forEach(t => t.selected = false);
        tubes[index].selected = true;
        renderBoard();
      }
    }
  }

  function shootConfetti(x, y, count = 15) {
    const colors = ['#ff5a5f', '#ffb400', '#00c2a8', '#4d8dff', '#b45bff', '#ff6ec7', '#ffffff'];
    for (let i = 0; i < count; i++) {
      const particle = document.createElement('div');
      particle.className = 'confetti';
      particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      particle.style.left = x + 'px';
      particle.style.top = y + 'px';
      
      const angle = Math.random() * Math.PI * 2;
      const distance = 50 + Math.random() * 150; 
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance - 50; 
      
      confettiLayer.appendChild(particle);
      
      particle.animate([
        { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${tx}px, ${ty}px) rotate(${Math.random() * 720 - 360}deg)`, opacity: 0 }
      ], {
        duration: 600 + Math.random() * 400,
        easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)',
        fill: 'forwards'
      });

      setTimeout(() => particle.remove(), 1000);
    }
  }

  function triggerShake() {
    boardEl.classList.remove('shake-effect');
    void boardEl.offsetWidth;
    boardEl.classList.add('shake-effect');
    setTimeout(() => boardEl.classList.remove('shake-effect'), 200);
  }

  function isTubeComplete(tube) {
    if (tube.liquids.length !== MAX_LAYERS) return false;
    const first = tube.liquids[0];
    return tube.liquids.every(c => c === first);
  }

  function animatePour(fromIdx, toIdx) {
    const fromTube = tubes[fromIdx];
    const toTube = tubes[toIdx];

    if (fromTube.liquids.length === 0) return;
    if (toTube.liquids.length >= MAX_LAYERS) return;

    const colorToPour = fromTube.liquids[fromTube.liquids.length - 1];
    if (toTube.liquids.length > 0) {
      const topColorInTarget = toTube.liquids[toTube.liquids.length - 1];
      if (topColorInTarget !== colorToPour) return;
    }

    let countToPour = 0;
    for (let i = fromTube.liquids.length - 1; i >= 0; i--) {
      if (fromTube.liquids[i] === colorToPour) countToPour++;
      else break;
    }

    if (toTube.liquids.length + countToPour > MAX_LAYERS) {
      countToPour = MAX_LAYERS - toTube.liquids.length;
    }
    if (countToPour === 0) return;

    isAnimating = true;
    selectedTubeIndex = null;
    tubes.forEach(t => t.selected = false);

    history.push({ from: fromIdx, to: toIdx, count: countToPour, color: colorToPour });

    const fromEl = document.getElementById('tube-' + fromIdx);
    const toEl = document.getElementById('tube-' + toIdx);
    
    const fromRect = fromEl.getBoundingClientRect();
    const toRect = toEl.getBoundingClientRect();

    fromEl.style.opacity = '0';

    const clone = document.createElement('div');
    clone.className = 'flying-tube';
    clone.style.left = fromRect.left + 'px';
    clone.style.top = fromRect.top + 'px';
    clone.innerHTML = fromEl.innerHTML;
    document.body.appendChild(clone);

    const targetX = toRect.left + toRect.width / 2 - fromRect.width / 2;
    const targetY = toRect.top - 120; 
    
    requestAnimationFrame(() => {
      clone.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
      clone.style.transform = `translate(${targetX - fromRect.left}px, ${targetY - fromRect.top}px)`;
    });

    setTimeout(() => {
      clone.style.transition = 'transform 0.3s ease-in-out';
      clone.style.transform = `translate(${targetX - fromRect.left}px, ${targetY - fromRect.top}px) rotate(55deg)`;

      setTimeout(() => {
        const stream = document.createElement('div');
        stream.className = 'stream';
        stream.style.backgroundColor = colorToPour;
        
        const streamX = targetX + (fromRect.width / 2) + 15; 
        const streamY = targetY + 10;
        
        stream.style.left = streamX + 'px';
        stream.style.top = streamY + 'px';
        stream.style.height = '0px';
        stream.style.opacity = '0';
        document.body.appendChild(stream);

        requestAnimationFrame(() => {
          const targetStreamEndY = toRect.top + 20;
          stream.style.height = Math.max(0, targetStreamEndY - streamY) + 'px';
          stream.style.opacity = '1';
        });

        setTimeout(() => {
          stream.style.opacity = '0';
          setTimeout(() => stream.remove(), 200);
        }, 400);

        const fromLiquids = clone.querySelectorAll('.liquid');
        const fromLiquidsToRemove = Array.from(fromLiquids).slice(-countToPour);
        
        const toBg = toEl.querySelector('.tube-bg');
        const newLiquids = [];
        for (let i = 0; i < countToPour; i++) {
          const newLiq = document.createElement('div');
          newLiq.className = 'liquid';
          newLiq.style.backgroundColor = colorToPour;
          newLiq.style.height = '0%';
          toBg.appendChild(newLiq);
          newLiquids.push(newLiq);
        }

        setTimeout(() => {
          newLiquids.forEach(liq => liq.style.height = '25%');
        }, 50);

        fromLiquidsToRemove.forEach(liq => {
          liq.style.height = '0%';
        });

      }, 300);
    }, 400);

    setTimeout(() => {
      for (let i = 0; i < countToPour; i++) {
        fromTube.liquids.pop();
        toTube.liquids.push(colorToPour);
      }
      
      clone.remove();
      fromEl.style.opacity = '1';
      
      if (isTubeComplete(toTube)) {
        triggerShake();
        shootConfetti(toRect.left + toRect.width / 2, toRect.top + toRect.height / 2, 25);
        
        renderBoard();
        const bgEl = document.getElementById('bg-' + toIdx);
        if (bgEl) {
          bgEl.classList.add('complete-flash');
          setTimeout(() => bgEl.classList.remove('complete-flash'), 600);
        }
      } else {
        renderBoard();
      }

      isAnimating = false;
      
      checkWin();
    }, 1200);
  }

  function checkWin() {
    for (let tube of tubes) {
      if (tube.liquids.length === 0) continue;
      if (!isTubeComplete(tube)) return false;
    }
    
    triggerShake();
    
    tubes.forEach((tube, i) => {
      if (isTubeComplete(tube)) {
        const el = document.getElementById('tube-' + i);
        if (el) {
          const r = el.getBoundingClientRect();
          shootConfetti(r.left + r.width / 2, r.top + r.height / 2, 30);
        }
      }
    });

    setTimeout(() => {
      document.getElementById('win-screen').classList.add('show');
    }, 500);
    return true;
  }

  function undo() {
    if (isAnimating || history.length === 0) return;
    const lastMove = history.pop();
    const fromTube = tubes[lastMove.from];
    const toTube = tubes[lastMove.to];

    for (let i = 0; i < lastMove.count; i++) {
      toTube.liquids.pop();
      fromTube.liquids.push(lastMove.color);
    }
    
    selectedTubeIndex = null;
    tubes.forEach(t => t.selected = false);
    renderBoard();
  }

  function restartLevel() {
    if (isAnimating) return;
    initLevel(currentLevel);
  }

  function nextLevel() {
    document.getElementById('win-screen').classList.remove('show');
    initLevel(currentLevel + 1);
  }

  function addTube() {
    if (isAnimating || hintCount <= 0) return;
    hintCount--;
    document.getElementById('hint-count').textContent = hintCount;
    tubes.push({ liquids: [], selected: false });
    renderBoard();
  }

  initLevel(loadLevel());
</script>
<script>if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>
</body>
</html>
